server {
    listen 80;
    listen 443 ssl http2;
    server_name enweb.235235.vip;

    # Configure certificates in BT panel (SSL tab), or uncomment paths below.
    # ssl_certificate     /www/server/panel/vhost/cert/enweb.235235.vip/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/enweb.235235.vip/privkey.pem;

    root /www/wwwroot/richRoad/web/dist;
    index index.html;

    # SPA routing for Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
