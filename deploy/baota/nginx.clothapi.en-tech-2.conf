server {
    listen 80;
    listen 443 ssl http2;
    server_name clothapi-en-tech-2.example.com;

    # Configure certificates in BT panel (SSL tab), or uncomment paths below.
    # ssl_certificate     /www/server/panel/vhost/cert/clothapi-en-tech-2.example.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/clothapi-en-tech-2.example.com/privkey.pem;

    client_max_body_size 100m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8658;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8658/health;
    }
}
