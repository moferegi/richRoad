name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
  release:
    types: [ created, edited ]
  workflow_dispatch:
    inputs:
      gva_version:
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    if: github.repository_owner == 'flipped-aurora'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: init
        run: |
          echo "flipped-aurora"
  frontend-web:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    name: Frontend web node 18.16.0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 18.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
        working-directory: ./web

      - name: Build web
        run: |
          npm run build
        working-directory: ./web

  frontend-uni:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    name: Frontend uni node 18.16.0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 18.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.16.0
          cache: npm
          cache-dependency-path: uni/package-lock.json

      - name: Lint uni
        run: |
          npm ci --no-audit --no-fund
          npm run lint
        working-directory: ./uni

      - name: Build uni h5
        run: |
          npm run build:h5
        working-directory: ./uni

  frontend:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    name: Frontend node 18.16.0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-web
      - frontend-uni
    steps:
      - name: Frontend summary
        run: |
          echo "frontend web/uni jobs passed"

  backend:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    name: Backend go
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        go-version: [1.24.2]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: server/go.sum
        id: go

      - name: Download modules
        run: |
          go mod download
          go mod verify
        working-directory: ./server

      - name: Test and Build
        run: |
          go test ./... -run TestDoesNotExist -count=1
          go test ./service/shop ./service/client ./task ./api/v1/client -count=1
          go build -v -race
        working-directory: ./server

  devops-test:
    if: github.ref == 'refs/heads/test'
    name: devops-test
    needs: 
      - init
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [18.16.0]
        go-version: [1.24.2]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Sed Config
        env:
          PROD: ${{ secrets.PROD }}
          TESTING: ${{ secrets.TESTING }}
        shell: bash
        run: |
          git branch 
          ls -l
          sed -i "s/${PROD}/${TESTING}/g" web/.env.production
          sed -i 's/${basePath}:${basePort}/${basePath}/g' web/src/view/systemTools/formCreate/index.vue
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build-Node
        run: |
          cd web/ && npm ci --no-audit --no-fund && npm run build
      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build-go
        run: |
          cd server/ && go mod tidy && CGO_ENABLED=0 go build && mkdir ../web/ser && mv server ../web/ser/ && cd ../web/ser/ && ls -s 
      - name: restart
        env:
          KEY: ${{ secrets.KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PROT: ${{ secrets.PROT }}
          MKDIRTEST: ${{ secrets.MKDIRTEST }}
          RETRY_MAX_ATTEMPTS: "3"
          RETRY_BASE_SLEEP_SECONDS: "5"
        run: |
          source .github/scripts/ci_retry.sh
          echo "[deploy-test] retry strategy"
          print_retry_policy
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=2)
          mkdir -p ~/.ssh/ && echo "$KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 github.com >> ~/.ssh/known_hosts
          run_with_retry "[deploy-test] upload web dist" scp -P ${PROT} "${SSH_OPTS[@]}" -r web/dist/* ${USER}@${HOST}:${MKDIRTEST}dist/
          run_with_retry "[deploy-test] upload web binary" scp -P ${PROT} "${SSH_OPTS[@]}" -r web/ser/* ${USER}@${HOST}:${MKDIRTEST}
          run_with_retry "[deploy-test] clean remote resources" ssh -p ${PROT} "${SSH_OPTS[@]}" ${USER}@${HOST} "cd ${MKDIRTEST}resource/ && rm -rf ${MKDIRTEST}resource/*"
          run_with_retry "[deploy-test] upload server resources" scp -P ${PROT} "${SSH_OPTS[@]}" -r server/resource/* ${USER}@${HOST}:${MKDIRTEST}resource/
          run_with_retry "[deploy-test] restart remote service" ssh -p ${PROT} "${SSH_OPTS[@]}" ${USER}@${HOST} "cd ${MKDIRTEST} && bash restart.sh > /dev/null  2>&1 &"

  release-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'flipped-aurora'}}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Sed Config
        env:
          GVA_VERSION: ${{ inputs.gva_version }}
        shell: bash
        run: |
          sed -i 's/当前版本.*`$/当前版本:v'${GVA_VERSION##v}'`/' web/src/core/config.js
          sed -i 's/当前版本.*$/当前版本:v'${GVA_VERSION##v}'/' server/core/server.go
          sed -i 's/当前版本.*$/当前版本:v'${GVA_VERSION##v}'/' web/src/core/gin-vue-admin.js
          sed -i 's/"version": ".*",$/"version": "'${GVA_VERSION##v}'",/' web/package.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add . && git commit -m "release: v${GVA_VERSION##v}"
      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      - uses: google-github-actions/release-please-action@v3
        with:
          command: release-pr
          release-type: simple
          changelog-path: docs/CHANGELOG.md
          release-as: ${{ inputs.gva_version }}
          package-name: gin-vue-admin
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false}]'

  release-please:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - init
      - backend
      - frontend
    outputs:
      release_created: ${{ steps.release_please.outputs.release_created }}
      tag_name: ${{ steps.release_please.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release_please
        with:
          #token: ${{ secrets.GAV_TOKEN }}
          command: github-release
          #signoff: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          release-type: simple
          changelog-path: docs/CHANGELOG.md
          #release-as: ${{ inputs.deploy_target }}
          package-name: gin-vue-admin
          #extra-files: |
          #  x-release-please-version.json
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false}]'

  devops-prod:
    if: needs.release-please.outputs.release_created || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - init
      - release-please
    name: devops-prod
    strategy:
      matrix:
        node-version: ['18.x']
        go-version: ['1.24.2']
    steps:
      - uses: actions/checkout@v4
      - name: tag major and minor versions
        run: |
          echo " ${{ needs.release-please.outputs.tag_name }}"
      - name: Sed Config
        shell: bash
        run: |
          git branch 
          ls -l
          sed -i 's/${basePath}:${basePort}/${basePath}/g' web/src/view/systemTools/formCreate/index.vue
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build-Node
        run: |
          cd web/ && npm ci --no-audit --no-fund && npm run build
      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build-go
        run: |
          cd server/ && go mod tidy && CGO_ENABLED=0 go build && mkdir ../web/ser && mv server ../web/ser/ && cd ../web/ser/ && ls -s 
      - name: restart
        env:
          KEY: ${{ secrets.KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PROT: ${{ secrets.PROT }}
          MKDIR: ${{ secrets.MKDIR }}
          RETRY_MAX_ATTEMPTS: "5"
          RETRY_BASE_SLEEP_SECONDS: "5"
        run: |
          source .github/scripts/ci_retry.sh
          echo "[deploy-prod] retry strategy"
          print_retry_policy
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=2)
          mkdir -p ~/.ssh/ && echo "$KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 github.com >> ~/.ssh/known_hosts
          run_with_retry "[deploy-prod] upload web dist" scp -P ${PROT} "${SSH_OPTS[@]}" -r web/dist/* ${USER}@${HOST}:${MKDIR}dist/
          run_with_retry "[deploy-prod] upload web binary" scp -P ${PROT} "${SSH_OPTS[@]}" -r web/ser/* ${USER}@${HOST}:${MKDIR}
          run_with_retry "[deploy-prod] clean remote resources" ssh -p ${PROT} "${SSH_OPTS[@]}" ${USER}@${HOST} "cd ${MKDIR}resource/ && rm -rf ${MKDIR}resource/*"
          run_with_retry "[deploy-prod] upload server resources" scp -P ${PROT} "${SSH_OPTS[@]}" -r server/resource/* ${USER}@${HOST}:${MKDIR}resource/
          run_with_retry "[deploy-prod] restart remote service" ssh -p ${PROT} "${SSH_OPTS[@]}" ${USER}@${HOST} "cd ${MKDIR} && bash restart.sh > /dev/null  2>&1 &"

  docker:
    name: docker
    if: github.ref == 'refs/heads/stop-stop-stop'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - init
      - release-please
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Login to Aliyun Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKERHUB_USER }}
          password: ${{ secrets.ALIYUN_DOCKERHUB_PASSWORD }}
      - name: Sed Config
        shell: bash
        run: |
          sed  -i 56c"\        && yarn install && yarn build" Makefile
          make image TAGS_OPT="latest"
          sed -i 's#./entrypoint.sh"#./entrypoint.sh","actions"#g' deploy/docker/Dockerfile
          sed -i "s#COPY build/ /usr/share/nginx/html/#COPY . /opt/gva#g" deploy/docker/Dockerfile
          sed -i 16c"\    && cd /opt/gva/server/ && go mod tidy && cd /opt/gva/web/ && yarn" deploy/docker/Dockerfile
          sed -i "s#open: true#open: false#g" web/vite.config.js
          make images TAGS_OPT="latest"
          docker push registry.cn-hangzhou.aliyuncs.com/gva/gin-vue-admin:latest
          docker push registry.cn-hangzhou.aliyuncs.com/gva/web:latest
          docker push registry.cn-hangzhou.aliyuncs.com/gva/server:latest
          docker push registry.cn-hangzhou.aliyuncs.com/gva/all:latest
